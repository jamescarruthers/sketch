<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sketch</title>
    <!-- Sets the theme before first paint, so Dark never flashes Light. Same key and rule as src/app/theme.ts. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var s = localStorage.getItem('sketch.theme');
          theme = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e2) { /* light */ }
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <!-- Until the stylesheet is in, the page is the canvas colour of the theme: --c-background in src/ui/tokens.css. -->
    <style>
      @media screen {
        html { background: #f6f7f8; }
        html[data-theme='dark'] { background: #16191d; color-scheme: dark; }
      }
    </style>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
